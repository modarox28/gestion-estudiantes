{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block contenido %}

<h2>Acceso de administrador</h2>
<p class="conteo">Solo el administrador puede agregar, editar o borrar estudiantes.</p>

<form class="tarjeta" method="post">
  <label for="usuario">Usuario</label>
  <input id="usuario" name="usuario" autocomplete="username" required autofocus>

  <label for="password">Contraseña</label>
  <input id="password" name="password" type="password"
         autocomplete="current-password" required>

  <div class="botones">
    <button type="submit">Entrar</button>
    <a class="cancelar" href="{{ url_for('index') }}">Cancelar</a>
  </div>
</form>

{% endblock %}
